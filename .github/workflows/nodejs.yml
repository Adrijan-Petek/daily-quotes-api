name: Daily Quotes API

# Trigger: every day at 9:00 UTC + manual trigger
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-daily-quotes:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run your API script from root
      - name: Run Daily Quotes Script
        run: node index.js
